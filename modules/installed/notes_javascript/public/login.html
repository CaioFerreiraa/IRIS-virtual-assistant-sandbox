<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar nas notas</title>
    <style>
        :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; margin: 0; display: grid; place-items: center;
            background: #f8f6fb; color: #332b38;
        }
        main {
            width: min(400px, calc(100% - 32px)); padding: 28px;
            border: 1px solid #ddd5e3; border-radius: 10px;
            background: #fff; box-shadow: 0 8px 24px rgba(71, 61, 83, 0.08);
        }
        h1 { margin: 0 0 8px; font-size: 26px; }
        p { margin: 0 0 22px; color: #756c7b; }
        form { display: grid; gap: 14px; }
        label { display: grid; gap: 6px; font-size: 14px; }
        input {
            width: 100%; padding: 10px 12px; font: inherit;
            border: 1px solid #ddd5e3; border-radius: 5px;
        }
        input:focus { outline: 2px solid #eee7f4; border-color: #6f5b7c; }
        button {
            padding: 10px 14px; border: 0; border-radius: 5px;
            background: #6f5b7c; color: white; font: inherit; cursor: pointer;
        }
        button:disabled { opacity: .65; cursor: wait; }
        #feedback { min-height: 20px; color: #8c3343; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <h1>Entrar nas notas</h1>
        <p>Informe as credenciais da demonstração para acessar as notas.</p>
        <form id="login-form">
            <label>Usuário<input name="login" autocomplete="username" required></label>
            <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
            <div id="feedback" role="alert" aria-live="polite"></div>
            <button type="submit">Entrar</button>
        </form>
    </main>
    <script>
        const form = document.querySelector("#login-form");
        const feedback = document.querySelector("#feedback");
        const button = form.querySelector("button");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            feedback.textContent = "";
            button.disabled = true;
            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        login: form.elements.login.value,
                        password: form.elements.password.value,
                    }),
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || "Não foi possível entrar.");
                }
                window.location.assign("/");
            } catch (error) {
                feedback.textContent = error.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
