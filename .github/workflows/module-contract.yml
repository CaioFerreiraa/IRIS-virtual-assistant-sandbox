name: Contrato de módulos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  module-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências do contrato
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flet==0.85.3" \
            "SQLAlchemy==2.0.51" \
            "httpx==0.28.1" \
            "numpy==2.4.6"
      - name: Executar testes de módulos
        run: |
          python -m unittest \
            tests.test_module_manifest \
            tests.test_module_registry \
            tests.test_module_execution \
            tests.test_module_runtime \
            tests.test_demo_modules \
            tests.test_module_search_and_routes \
            tests.test_module_development_tools \
            tests.test_module_developer_mode
